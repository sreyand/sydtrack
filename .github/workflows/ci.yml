name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # Headless Linux otherwise auto-enables demoMode and skips mock backends.
          SYDTRACK_DEMO: '0'
          SYDTRACK_FORCE_REAL: '1'
