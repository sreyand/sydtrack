name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # Headless Linux otherwise auto-enables demoMode and skips mock backends.
          SYDTRACK_DEMO: '0'
          SYDTRACK_FORCE_REAL: '1'
